spring:
  application:
    name: contract-auditor
  config:
    import:
      - optional:file:${APP_ENV_FILE:C:/env.properties}
      - optional:file:../env.properties
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    from: ${MAIL_FROM}
  password-reset:
    frontend-base-url: ${FRONTEND_BASE_URL}
    token-expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  notification:
    scheduler-cron: ${NOTIFICATION_CRON}
    default-reminder-days: 7
  email-discovery:
    enabled: ${EMAIL_DISCOVERY_ENABLED}
    google-client-id: ${GOOGLE_CLIENT_ID}
    google-client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI}
    token-encryption-key: ${EMAIL_TOKEN_ENCRYPTION_KEY}
    scan-max-messages: 100
    scan-lookback-days: 730

server:
  port: ${SERVER_PORT}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.contractauditor: INFO
    com.contractauditor.controller: INFO
    com.contractauditor.service.impl: DEBUG
